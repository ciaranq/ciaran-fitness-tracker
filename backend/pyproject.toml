[project]
name = "ciaran-fitness-tracker-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "watchdog>=5.0.0",
    "polars>=1.9.0",
    "duckdb>=1.1.0",
    "garth>=0.5.0",
    "garminconnect>=0.2.16",
    "fitparse>=1.2.0",
    "pytest>=8.3.0",
    "importlib-metadata>=8.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "engine", "integrations", "routers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-p", "no:logfire"]
